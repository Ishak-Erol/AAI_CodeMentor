<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Team CodeMentor{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 font-sans min-h-screen">
    <header class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center shadow-md">
        <a href="/threads" class="flex items-center gap-3">
            <div class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wider text-white">CodeMentor <span class="text-blue-400">AAI</span></h1>
        </a>
        <nav class="text-sm text-gray-400 font-mono flex gap-4">
            <a href="/threads" class="hover:text-blue-400">Threads</a>
            <a href="/" class="hover:text-blue-400">Dashboard</a>
        </nav>
    </header>
    <main class="p-6 max-w-5xl mx-auto">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
