<div id="testat-container">
{% if testat %}
<ol class="testat-list panel">
    {% for question in questions %}
    <li>{{ question.question }}
        <span class="concept">Konzept: {{ question.concept }}</span>
    </li>
    {% endfor %}
</ol>
{% else %}
<div class="panel" style="color: var(--text-muted); font-style: italic; margin-bottom: 1rem;">
    Noch kein Testat für diesen Thread.
</div>
<form hx-post="/threads/{{ thread.id }}/testat/generate" hx-target="#testat-container" hx-swap="outerHTML" hx-indicator="#gen-spinner">
    <button type="submit">Testat jetzt generieren</button>
    <span id="gen-spinner" class="htmx-indicator" style="margin-left: 0.5rem; font-size: 0.8rem; color: var(--text-muted);">läuft...</span>
</form>
{% endif %}
</div>
